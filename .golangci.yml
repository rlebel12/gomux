version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

linters:
  default: all
  disable:
    # Framework-specific (not applicable)
    - arangolint
    - ginkgolinter
    - promlinter
    - spancheck
    - zerologlint
    - protogetter
    # Overly opinionated
    - exhaustruct
    - varnamelen
    - testpackage
    - nonamedreturns
    - godox
    - nlreturn
    - noinlineerr
    - gocyclo  # replaced by cyclop
    # Deprecated
    - wsl
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
    gosec:
      severity: low
      confidence: low
    gocritic:
      enabled-tags: [diagnostic, style, performance, experimental, opinionated]
    cyclop:
      max-complexity: 15
    gocognit:
      min-complexity: 20
    funlen:
      lines: 100
      statements: 50
    nestif:
      min-complexity: 4
    lll:
      line-length: 120
    dupl:
      threshold: 100
    nakedret:
      max-func-lines: 30
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: "use structured logging instead of fmt.Print*"
        - pattern: ^panic$
          msg: "return errors instead of using panic"
        - pattern: ^exec\.Command\(
          msg: "use exec.CommandContext for cancellation support"
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: "io/ioutil is deprecated, use io or os packages"
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - errcheck
          - dupl
          - gosec
          - funlen
          - gocognit
      - path: cmd/.*/main\.go
        linters:
          - cyclop
          - funlen

# NOTE: Do not use golangci-lint's bundled formatters (gofumpt, goimports).
# They have bugs with complex Go syntax. Run formatters via pre-commit hooks instead.
